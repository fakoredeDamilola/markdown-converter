<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .button {
        display: inline-block;
        padding: 10px 20px;
        border: 0;
        margin: 10px;
        font-size: 16px;
        text-align: center;
        text-decoration: none;
        color: white;
        background-color: #4caf50;
        border-radius: 5px;
        cursor: pointer;
      }
      .google {
        background-color: #db4437;
      }
      .github {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <div style="padding: 30px 0px">
      <div
        style="
          background-color: white;
          border-radius: 8px;
          padding: 25px;
          width: 100%;
          box-sizing: border-box;
          margin: 0% auto;
        "
      >
        <p style="text-align: center; font-weight: 800; font-size: 28px">
          Join the markdown Community
        </p>
       
        <div
          style="display:flex;justify-content: center; align-items: center; margin: 20px 0"
        >
          <button class="button google">
            <a style="text-decoration: none; color: white" href="/auth/google">
              Sign in with Email
            </a>
          </button>
</div>
          
          <div
            style="width: 100%; height: 1px; margin: 20px 0; background: #e0e0e0"
          ></div>

          <p style="text-align: center;">
            DOn't have an account
            <span style="color: blue; cursor: pointer"> <a style="text-decoration: none;" href="/signup.html">
             Sign up
            </a></span>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
